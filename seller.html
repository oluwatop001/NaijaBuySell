<!doctype html>
<html lang="en-NG">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sell an Item — NaijaBuy&Sell</title>
<link rel="stylesheet" href="styles.css">
<style>
.formbox{max-width:760px;margin:32px auto;padding:24px;border:1px solid #ddd;border-radius:18px;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.full{grid-column:1/-1} label{display:block;font-weight:600;margin-bottom:6px}
input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:10px;font:inherit}
textarea{min-height:140px;resize:vertical}.help{font-size:.9rem;color:#666;margin-top:5px}
.status{margin-top:16px;padding:12px;border-radius:10px;display:none}
.preview{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.preview img{width:100px;height:100px;object-fit:cover;border-radius:10px;border:1px solid #ddd}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head>
<body>
<header class="top"><div class="wrap nav">
<a class="brand" href="index.html"><span class="mark">N</span><span>NaijaBuy<span>&</span>Sell</span></a>
<nav><a href="index.html">Home</a><a href="search.html">Browse</a><a href="categories.html">Categories</a><a href="locations.html">Locations</a><a href="help.html">Help</a></nav>
<a class="sell" href="seller.html">Sell an Item</a></div></header>
<main class="wrap section"><div class="formbox"><span class="eyebrow">SELL</span>
<h1>List your item</h1><p class="muted">Create a listing for buyers on NaijaBuy&Sell.</p>
<form id="listingForm"><div class="grid">
<div class="full"><label for="title">Item title</label><input id="title" maxlength="120" required placeholder="e.g. Samsung Galaxy A55"></div>
<div><label for="price">Price (₦)</label><input id="price" type="number" min="0" step="0.01" required placeholder="250000"></div>
<div><label for="category">Category</label><select id="category" required><option value="">Select category</option><option>Electronics</option><option>Vehicles</option><option>Home</option><option>Appliances</option><option>Fashion</option><option>Real Estate</option><option>Properties</option><option>Other</option></select></div>
<div><label for="location">Location</label><input id="location" maxlength="120" required placeholder="Ibadan, Oyo"></div>
<div><label for="condition">Condition</label><select id="condition" required><option value="">Select condition</option><option>New</option><option>Like New</option><option>Used - Good</option><option>Used - Fair</option></select></div>
<div class="full"><label for="description">Description</label><textarea id="description" maxlength="5000" required placeholder="Describe the item, its condition and important details."></textarea></div>
<div class="full"><label for="delivery">Delivery arrangement</label><select id="delivery" required><option value="">Select arrangement</option><option>Seller delivery</option><option>Buyer pickup</option><option>Seller delivery or buyer pickup</option></select><div class="help">The seller manages delivery or pickup.</div></div>
<div class="full"><label for="photos">Photos</label><input id="photos" type="file" accept="image/*" multiple><div class="help">Maximum 6 images, 5 MB each.</div><div id="preview" class="preview"></div></div>
</div><button class="button" id="publishBtn" type="submit">Publish Listing</button><div id="status" class="status"></div></form>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script><script src="supabase-client.js"></script>
<script>
const form=document.getElementById("listingForm"),photos=document.getElementById("photos"),preview=document.getElementById("preview"),status=document.getElementById("status"),publishBtn=document.getElementById("publishBtn");
function showStatus(t,ok=false){status.textContent=t;status.style.display="block";status.style.background=ok?"#e8f7ed":"#fff3f3";}
photos.onchange=()=>{preview.innerHTML="";[...photos.files].slice(0,6).forEach(f=>{const i=document.createElement("img");i.src=URL.createObjectURL(f);preview.appendChild(i);});if(photos.files.length>6)showStatus("Please choose no more than 6 images.");};
form.onsubmit=async e=>{e.preventDefault();status.style.display="none";publishBtn.disabled=true;
try{
const {data:{user},error:ue}=await NAIJA_SUPABASE.auth.getUser();if(ue)throw ue;if(!user)throw new Error("Please log in before creating a listing.");
const files=[...photos.files].slice(0,6),price=Number(document.getElementById("price").value);if(!Number.isFinite(price)||price<0)throw new Error("Please enter a valid price.");
const listing={seller_id:user.id,title:document.getElementById("title").value.trim(),description:document.getElementById("description").value.trim(),price,category:document.getElementById("category").value,location:document.getElementById("location").value.trim(),condition:document.getElementById("condition").value,delivery_arrangement:document.getElementById("delivery").value};
const {data:created,error:ce}=await NAIJA_SUPABASE.from("listings").insert(listing).select("id").single();if(ce)throw ce;
for(let i=0;i<files.length;i++){const f=files[i];if(f.size>5*1024*1024)throw new Error("Each image must be 5 MB or smaller.");if(!f.type.startsWith("image/"))throw new Error("Only image files are allowed.");const ext=(f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,""),path=user.id+"/"+created.id+"/"+Date.now()+"-"+i+"."+ext;
const {error:up}=await NAIJA_SUPABASE.storage.from("listing-images").upload(path,f,{upsert:false,contentType:f.type});if(up)throw up;
const {error:ie}=await NAIJA_SUPABASE.from("listing_images").insert({listing_id:created.id,storage_path:path,alt_text:listing.title});if(ie)throw ie;}
showStatus("Listing submitted successfully. It will appear publicly after approval.",true);form.reset();preview.innerHTML="";
}catch(err){showStatus(err.message||"Could not publish the listing.");}finally{publishBtn.disabled=false;}};
</script></body></html>
