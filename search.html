<!doctype html><html lang="en-NG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search — NaijaBuy&Sell</title><meta name="description" content="Search approved products across Nigeria."><link rel="stylesheet" href="styles.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html"><span class="mark">N</span><span>NaijaBuy<span>&</span>Sell</span></a><nav><a href="index.html">Home</a><a href="categories.html">Categories</a><a href="locations.html">Locations</a></nav><a class="sell" href="seller.html">Sell an Item</a></div></header><main class="wrap section"><div class="searchbox"><input id="q" placeholder="Search products, sellers or locations"><button onclick="run()">Search</button></div><div class="filterbar"><label>Category <select id="cat"><option value="">All</option><option>Electronics</option><option>Vehicles</option><option>Home</option><option>Appliances</option><option>Fashion</option><option>Real Estate</option><option>Properties</option><option>Other</option></select></label><label>Location <select id="loc"><option value="">All</option><option>Lagos</option><option>Abuja</option><option>Ibadan</option><option>Port Harcourt</option><option>Kano</option></select></label><label>Sort <select id="sort"><option value="">Newest</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option></select></label></div><h1 id="heading">Marketplace listings</h1><div id="grid" class="grid"><p>Loading listings…</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="marketplace.js"></script><script>const z=new URLSearchParams(location.search),q=document.getElementById('q'),cat=document.getElementById('cat'),loc=document.getElementById('loc'),sort=document.getElementById('sort'),heading=document.getElementById('heading'),grid=document.getElementById('grid');q.value=z.get('q')||'';cat.value=z.get('cat')||'';loc.value=z.get('loc')||'';sort.value=z.get('sort')||'';function run(){let u=new URLSearchParams();[['q',q.value.trim()],['cat',cat.value],['loc',loc.value],['sort',sort.value]].forEach(x=>x[1]&&u.set(x[0],x[1]));location.href='search.html?'+u} (async()=>{try{let a=await NBS_MARKETPLACE.approvedListings(100),query=(z.get('q')||'').toLowerCase(),category=z.get('cat')||'',lv=z.get('loc')||'';a=a.filter(p=>(!query||[p.title,p.category,p.location,p.city,p.state,p.description].join(' ').toLowerCase().includes(query))&&(!category||p.category===category)&&(!lv||p.location===lv||p.city===lv||p.state===lv));if(sort.value==='low')a.sort((x,y)=>x.price-y.price);if(sort.value==='high')a.sort((x,y)=>y.price-x.price);a=await NBS_MARKETPLACE.addImages(a);heading.textContent=query?'Results for “'+NBS_MARKETPLACE.esc(z.get('q'))+'”':'Marketplace listings';grid.innerHTML=a.map(NBS_MARKETPLACE.card).join('')||'<p>No approved listings match your search.</p>'}catch(e){grid.innerHTML='<p>Could not load listings right now. Please refresh.</p>'}})();</script></body></html>
