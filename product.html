<!doctype html><html lang="en-NG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — NaijaBuy&Sell</title><link rel="stylesheet" href="styles.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html"><span class="mark">N</span><span>NaijaBuy<span>&</span>Sell</span></a><nav><a href="index.html">Home</a><a href="search.html">Browse</a><a href="categories.html">Categories</a></nav><a class="sell" href="seller.html">Sell an Item</a></div></header><main class="wrap section"><div id="crumb" class="crumb"></div><div id="product"><p>Loading listing…</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="marketplace.js"></script><script>const id=new URLSearchParams(location.search).get('id');(async()=>{try{const{data:l,error}=await NAIJA_SUPABASE.from('listings').select('id,title,description,price,category,condition,state,city,location,delivery_arrangement').eq('id',id).eq('status','approved').eq('is_deleted',false).single();if(error||!l)throw 0;const a=(await NBS_MARKETPLACE.addImages([l]))[0],place=a.location||[a.city,a.state].filter(Boolean).join(', ')||'Nigeria',photo=a.image_url?`<img src="${NBS_MARKETPLACE.esc(a.image_url)}" alt="${NBS_MARKETPLACE.esc(a.title)}" style="width:100%;height:100%;object-fit:cover;border-radius:16px">`:'🛍️';document.title=a.title+' for Sale — NaijaBuy&Sell';document.getElementById('crumb').innerHTML='<a href="index.html">Home</a> / '+NBS_MARKETPLACE.esc(a.category||'Marketplace')+' / '+NBS_MARKETPLACE.esc(a.title);document.getElementById('product').innerHTML=`<div class="detail"><div><div class="mainphoto">${photo}</div></div><div class="detail-copy"><span class="badge">${NBS_MARKETPLACE.esc(a.condition||'Used')}</span><h1>${NBS_MARKETPLACE.esc(a.title)}</h1><div class="price">${NBS_MARKETPLACE.money(a.price)}</div><p class="muted">📍 ${NBS_MARKETPLACE.esc(place)} · ${NBS_MARKETPLACE.esc(a.category||'Other')}</p><p>${NBS_MARKETPLACE.esc(a.description||'')}</p><div class="actions"><button class="button" onclick="alert('Checkout preview only. Payment backend is not connected yet.')">Buy securely</button><button class="ghost" onclick="share()">↗ Share</button></div><div class="notice"><b>Protected transaction journey</b><br>Buyer pays → seller delivers → buyer confirms receipt → payout release.</div></div></div>`}catch(e){document.getElementById('product').innerHTML='<p>We couldn\'t find this listing. It may have been removed or is not approved yet.</p>'}})();function share(){if(navigator.share)navigator.share({title:document.title,url:location.href});else alert(location.href)}</script></body></html>
